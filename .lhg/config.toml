# .lhg/config.toml — Generated by lhg vv0.1.0
# Project-local lhg configuration. Checked into the repo.
# Edit freely; re-running `lhg init` will NOT overwrite this file.
# Docs: docs/10-convention.md

[version]
scheme = "semver" # yym | semver | calver (see 30-versioning.md)
auto_tag = true # post-commit hook tags version-prefixed commits
auto_changelog = true # post-commit hook appends a changelog entry

[[version.files]]
path = "package.json"
kind = "json"

[changelog]
# Split entries into per-major files: docs/changelogs/v{MAJOR}.x.md
series = "major" # major | minor | single (see 40-changelog.md)

[filesize]
max_size = "512K"
ignore = ".lhg/filesize.ignore" # gitignore-style (see 60-hooks.md)

[secret]
enabled = true
